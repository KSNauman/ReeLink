<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ReelLink • Automation Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #090d16;
      --bg-card: rgba(18, 24, 36, 0.82);
      --bg-card-subtle: rgba(23, 32, 48, 0.7);
      --bg-card-hover: rgba(28, 38, 58, 0.9);
      --border: #222d42;
      --border-subtle: rgba(255, 255, 255, 0.08);
      --border-focus: #3b82f6;

      --text: #f8fafc;
      --text-muted: #94a3b8;
      --text-dim: #64748b;

      --accent: #38bdf8;
      --accent-glow: rgba(56, 189, 248, 0.15);
      
      --brand-gradient: linear-gradient(135deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
      --btn-primary: linear-gradient(135deg, #059669 0%, #10b981 100%);
      --btn-primary-hover: linear-gradient(135deg, #047857 0%, #059669 100%);
      --btn-primary-shadow: 0 4px 18px rgba(16, 185, 129, 0.35);

      --success: #10b981;
      --success-bg: rgba(16, 185, 129, 0.12);
      --success-border: rgba(16, 185, 129, 0.28);

      --info: #38bdf8;
      --info-bg: rgba(56, 189, 248, 0.12);
      --info-border: rgba(56, 189, 248, 0.28);

      --warning: #f59e0b;
      --warning-bg: rgba(245, 158, 11, 0.12);
      --warning-border: rgba(245, 158, 11, 0.28);

      --danger: #ef4444;
      --danger-bg: rgba(239, 68, 68, 0.12);
      --danger-border: rgba(239, 68, 68, 0.28);

      --radius-sm: 6px;
      --radius-md: 10px;
      --radius-lg: 14px;
      --radius-pill: 9999px;

      --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.35);
      --shadow-md: 0 6px 20px -4px rgba(0, 0, 0, 0.55), 0 0 0 1px var(--border-subtle);
      --shadow-lg: 0 12px 32px -6px rgba(0, 0, 0, 0.65), 0 0 0 1px var(--border-subtle);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      padding: 24px 16px 40px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      overflow-x: hidden;
    }

    /* WebGL Shader Background Canvas */
    #shader-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 0;
      pointer-events: none;
      display: block;
    }

    .container {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 860px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* Header */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 20px;
      background: var(--bg-card);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-md);
      position: relative;
      overflow: hidden;
    }

    header::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(56, 189, 248, 0.35), transparent);
    }

    .logo-group {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo-badge {
      width: 42px;
      height: 42px;
      border-radius: var(--radius-md);
      background: var(--brand-gradient);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      box-shadow: 0 4px 14px rgba(220, 39, 67, 0.35);
      flex-shrink: 0;
    }

    .brand-title {
      font-size: 1.25rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .brand-badge {
      font-size: 0.65rem;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: var(--radius-pill);
      background: var(--info-bg);
      color: var(--accent);
      border: 1px solid var(--info-border);
      letter-spacing: 0.04em;
    }

    .subtitle {
      font-size: 0.78rem;
      color: var(--text-muted);
      font-weight: 500;
      margin-top: 1px;
    }

    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 14px;
      border-radius: var(--radius-pill);
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      background: var(--bg-card-subtle);
      border: 1px solid var(--border-subtle);
      box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.2);
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--success);
      box-shadow: 0 0 10px rgba(16, 185, 129, 0.6);
    }

    .status-dot.pulse {
      animation: pulse-dot 1.5s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }

    @keyframes pulse-dot {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.4); opacity: 0.7; box-shadow: 0 0 14px rgba(56, 189, 248, 0.9); }
    }

    /* Primary Action Card */
    .action-card {
      background: var(--bg-card);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      padding: 24px 20px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      box-shadow: var(--shadow-md);
      position: relative;
    }

    /* Liquid Metal Button Component Styles */
    .liquid-metal-wrapper {
      position: relative;
      display: inline-block;
      margin: 4px 0;
    }

    .liquid-metal-perspective {
      perspective: 1000px;
      perspective-origin: 50% 50%;
    }

    .liquid-metal-root {
      position: relative;
      width: 240px;
      height: 52px;
      transform-style: preserve-3d;
      transition: all 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .lm-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      transform-style: preserve-3d;
      transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .lm-layer-shader {
      transform: translateZ(0px);
      z-index: 10;
      border-radius: 100px;
      box-shadow: 
        0px 0px 0px 1px rgba(0, 0, 0, 0.4),
        0px 18px 24px -6px rgba(0, 0, 0, 0.6),
        0px 6px 14px -3px rgba(16, 185, 129, 0.35);
      transition: box-shadow 0.3s ease;
    }

    .liquid-metal-root:hover .lm-layer-shader {
      box-shadow: 
        0px 0px 0px 1px rgba(16, 185, 129, 0.5),
        0px 22px 32px -4px rgba(0, 0, 0, 0.75),
        0px 0px 30px rgba(16, 185, 129, 0.5);
    }

    .lm-shader-container {
      width: 100%;
      height: 100%;
      border-radius: 100px;
      overflow: hidden;
      position: relative;
    }

    .lm-canvas {
      width: 100%;
      height: 100%;
      display: block;
      border-radius: 100px;
    }

    .lm-layer-inner {
      transform: translateZ(10px);
      z-index: 20;
      pointer-events: none;
    }

    .lm-inner-pill {
      width: calc(100% - 4px);
      height: calc(100% - 4px);
      margin: 2px;
      border-radius: 100px;
      background: linear-gradient(180deg, rgba(28, 38, 54, 0.95) 0%, rgba(10, 14, 22, 0.98) 100%);
      box-shadow: inset 0 1px 2px rgba(255, 255, 255, 0.15), inset 0 -1px 2px rgba(0, 0, 0, 0.6);
      transition: all 0.3s ease;
    }

    .liquid-metal-root.is-pressed .lm-layer-inner {
      transform: translateZ(10px) translateY(1px) scale(0.98);
    }

    .liquid-metal-root.is-pressed .lm-inner-pill {
      box-shadow: inset 0px 2px 5px rgba(0, 0, 0, 0.8), inset 0px 1px 2px rgba(0, 0, 0, 0.6);
    }

    .lm-layer-content {
      transform: translateZ(20px);
      z-index: 30;
      pointer-events: none;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      color: #ffffff;
      font-weight: 700;
      font-size: 0.95rem;
      letter-spacing: 0.04em;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.85);
      user-select: none;
    }

    .lm-icon {
      font-size: 0.85rem;
      color: var(--success);
      filter: drop-shadow(0 0 8px rgba(16, 185, 129, 0.8));
    }

    .lm-interactive-btn {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: transparent !important;
      border: none !important;
      cursor: pointer;
      outline: none;
      z-index: 40;
      transform: translateZ(25px);
      border-radius: 100px;
      overflow: hidden;
      box-shadow: none !important;
    }

    .lm-interactive-btn:disabled {
      cursor: not-allowed;
      pointer-events: auto;
    }

    .liquid-metal-root.is-disabled {
      opacity: 0.55;
      filter: grayscale(0.4);
    }

    /* Ripple Animation */
    .lm-ripple {
      position: absolute;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(16, 185, 129, 0.6) 0%, rgba(56, 189, 248, 0.35) 40%, rgba(255, 255, 255, 0) 70%);
      pointer-events: none;
      transform: translate(-50%, -50%) scale(0);
      animation: ripple-animation 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes ripple-animation {
      0% {
        transform: translate(-50%, -50%) scale(0);
        opacity: 0.8;
      }
      100% {
        transform: translate(-50%, -50%) scale(8);
        opacity: 0;
      }
    }

    .btn-stop {
      padding: 8px 18px;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--danger);
      background: var(--danger-bg);
      border: 1px solid var(--danger-border);
      border-radius: var(--radius-md);
      cursor: pointer;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .btn-stop:hover {
      background: rgba(239, 68, 68, 0.22);
    }

    .progress-box {
      width: 100%;
      max-width: 480px;
      margin-top: 4px;
    }

    .progress-bar-bg {
      width: 100%;
      height: 7px;
      background: var(--bg-card-subtle);
      border-radius: var(--radius-pill);
      overflow: hidden;
      border: 1px solid var(--border-subtle);
    }

    .progress-bar-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #10b981 0%, #38bdf8 100%);
      border-radius: var(--radius-pill);
      transition: width 0.35s ease;
      box-shadow: 0 0 12px rgba(56, 189, 248, 0.5);
    }

    .progress-status {
      font-size: 0.82rem;
      color: var(--text-muted);
      font-weight: 500;
      margin-top: 8px;
    }

    /* Metrics Grid */
    .metrics-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }

    @media (max-width: 640px) {
      .metrics-grid {
        grid-template-columns: 1fr 1fr;
      }
    }

    .metric-card {
      background: var(--bg-card);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      padding: 16px 14px;
      text-align: center;
      box-shadow: var(--shadow-sm);
      transition: transform 0.2s ease, border-color 0.2s ease;
      position: relative;
      overflow: hidden;
    }

    .metric-card:hover {
      transform: translateY(-1px);
      border-color: rgba(255, 255, 255, 0.14);
    }

    .metric-val {
      font-size: 1.6rem;
      font-weight: 800;
      color: var(--text);
      letter-spacing: -0.02em;
      line-height: 1.2;
      font-variant-numeric: tabular-nums;
    }

    .metric-label {
      font-size: 0.7rem;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-top: 5px;
    }

    /* Section Cards */
    .section-card {
      background: var(--bg-card);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      padding: 18px 20px;
      box-shadow: var(--shadow-md);
    }

    .section-title {
      font-size: 0.95rem;
      font-weight: 700;
      letter-spacing: -0.01em;
      color: var(--text);
      margin-bottom: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }

    .section-title-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .section-title-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .section-desc {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-bottom: 14px;
      line-height: 1.45;
    }

    /* Action Buttons & Unfollow Controls */
    .btn-action {
      padding: 6px 14px;
      font-size: 0.78rem;
      font-weight: 600;
      border-radius: var(--radius-md);
      cursor: pointer;
      border: 1px solid transparent;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .btn-unfollow-eligible {
      background: var(--success-bg);
      color: var(--success);
      border-color: var(--success-border);
    }

    .btn-unfollow-eligible:hover:not(:disabled) {
      background: rgba(16, 185, 129, 0.22);
      transform: translateY(-1px);
    }

    .btn-unfollow-all {
      background: var(--danger-bg);
      color: var(--danger);
      border-color: var(--danger-border);
    }

    .btn-unfollow-all:hover:not(:disabled) {
      background: rgba(239, 68, 68, 0.22);
      transform: translateY(-1px);
    }

    .btn-action:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      transform: none !important;
    }

    /* Retention Metric Split Cards */
    .retention-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 14px;
    }

    @media (max-width: 540px) {
      .retention-grid {
        grid-template-columns: 1fr;
      }
    }

    .retention-stat-box {
      border-radius: var(--radius-md);
      padding: 12px 16px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .retention-stat-eligible {
      background: var(--success-bg);
      border: 1px solid var(--success-border);
    }

    .retention-stat-protected {
      background: var(--info-bg);
      border: 1px solid var(--info-border);
    }

    .retention-stat-label {
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .retention-stat-val {
      font-size: 1.45rem;
      font-weight: 800;
      color: var(--text);
      font-variant-numeric: tabular-nums;
    }

    /* Table Styles */
    .table-container {
      overflow-x: auto;
      border-radius: var(--radius-md);
      border: 1px solid var(--border-subtle);
      background: var(--bg-card-subtle);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.82rem;
      text-align: left;
    }

    th {
      color: var(--text-dim);
      font-weight: 700;
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      padding: 10px 14px;
      background: rgba(0, 0, 0, 0.28);
      border-bottom: 1px solid var(--border-subtle);
      white-space: nowrap;
    }

    td {
      padding: 10px 14px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.04);
      color: var(--text);
      vertical-align: middle;
      font-variant-numeric: tabular-nums;
    }

    tr:last-child td {
      border-bottom: none;
    }

    tbody tr {
      transition: background 0.15s ease;
    }

    tbody tr:hover {
      background: var(--bg-card-hover);
    }

    /* Tag / Badges */
    .tag {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 3px 8px;
      border-radius: var(--radius-sm);
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.03em;
      line-height: 1;
      white-space: nowrap;
    }

    .tag-success {
      background: var(--success-bg);
      color: var(--success);
      border: 1px solid var(--success-border);
    }

    .tag-blue {
      background: var(--info-bg);
      color: var(--info);
      border: 1px solid var(--info-border);
    }

    .tag-muted {
      background: rgba(148, 163, 184, 0.1);
      color: var(--text-muted);
      border: 1px solid rgba(148, 163, 184, 0.2);
    }

    .tag-fail {
      background: var(--danger-bg);
      color: var(--danger);
      border: 1px solid var(--danger-border);
    }

    /* Logs Console */
    .console-box {
      background: rgba(6, 9, 16, 0.9);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      padding: 14px 16px;
      font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 0.78rem;
      height: 160px;
      overflow-y: auto;
      color: #a7f3d0;
      display: flex;
      flex-direction: column;
      gap: 6px;
      line-height: 1.5;
      box-shadow: inset 0 2px 6px rgba(0, 0, 0, 0.4);
    }

    .log-entry {
      display: flex;
      gap: 10px;
      align-items: flex-start;
    }

    .log-time {
      color: var(--text-dim);
      flex-shrink: 0;
      font-variant-numeric: tabular-nums;
    }

    .log-msg {
      word-break: break-word;
    }

    /* Links */
    a {
      color: var(--accent);
      text-decoration: none;
      transition: color 0.15s ease;
      font-weight: 600;
    }

    a:hover {
      color: #7dd3fc;
      text-decoration: underline;
    }

    /* Scrollbar styling */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.15);
      border-radius: var(--radius-pill);
    }
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(255, 255, 255, 0.25);
    }
  </style>
</head>
<body>
  <!-- WebGL Mesh Drift Shader Background -->
  <canvas id="shader-canvas" aria-hidden="true"></canvas>

  <div class="container">
    <!-- Header -->
    <header>
      <div class="logo-group">
        <div class="brand-title">ReelLink</div>
      </div>
      <div class="status-pill" id="status-pill">
        <div class="status-dot" id="status-dot"></div>
        <span id="status-text">Connecting...</span>
      </div>
    </header>

    <!-- Trigger Action Card (Powered by Liquid Metal Engine) -->
    <div class="action-card">
      <div class="liquid-metal-wrapper">
        <div class="liquid-metal-perspective">
          <div class="liquid-metal-root" id="liquid-metal-root">
            <!-- Layer 1: Liquid Metal WebGL Shader Canvas (translateZ 0px) -->
            <div class="lm-layer lm-layer-shader">
              <div class="lm-shader-container">
                <canvas id="lm-shader-canvas" class="lm-canvas"></canvas>
              </div>
            </div>

            <!-- Layer 2: Inner Dark Metallic Bezel (translateZ 10px) -->
            <div class="lm-layer lm-layer-inner" id="lm-layer-inner">
              <div class="lm-inner-pill"></div>
            </div>

            <!-- Layer 3: Text Label (translateZ 20px) -->
            <div class="lm-layer lm-layer-content">
              <span id="btn-text" class="lm-text">START BATCH</span>
            </div>

            <!-- Layer 4: Interactive Button Surface (translateZ 25px) -->
            <button class="btn-start lm-interactive-btn" id="btn-start" onclick="handleStartBatchClick(event)" aria-label="Start Batch Execution">
            </button>
          </div>
        </div>
      </div>

      <button class="btn-stop" id="btn-stop" onclick="stopBatch()" style="display: none;" aria-label="Stop Batch Execution">
        Stop Batch
      </button>

      <div class="progress-box" id="progress-box" style="display: none;">
        <div class="progress-bar-bg">
          <div class="progress-bar-fill" id="progress-fill"></div>
        </div>
        <div class="progress-status" id="progress-text">Preparing batch...</div>
      </div>
    </div>

    <!-- Metrics Grid -->
    <div class="metrics-grid">
      <div class="metric-card">
        <div class="metric-val" id="metric-pending">0</div>
        <div class="metric-label">Pending Queue</div>
      </div>
      <div class="metric-card">
        <div class="metric-val" id="metric-completed">0</div>
        <div class="metric-label">Total Completed</div>
      </div>
    </div>

    <!-- Recent Reels Table -->
    <div class="section-card" aria-label="Recent Processed Reels">
      <div class="section-title">
        <div class="section-title-left">
          <span>Recent Reels</span>
        </div>
      </div>
      <div class="table-container">
        <table>
          <thead>
            <tr>
              <th>Creator</th>

  <script>

      const FRAG = `#ifdef GL_FRAGMENT_PRECISION_HIGH
precision highp float;
#else
precision mediump float;
#endif

uniform vec3 u_colors[8];
uniform vec4 u_scene;      // resolution.xy, time, colour count
uniform vec4 u_shape;      // scale, intensity, paramA, warp
uniform vec4 u_surface;    // detail, contrast, brightness, saturation
uniform vec4 u_finish;     // hue, vignette, blur, grain
uniform vec4 u_transform;  // seed, rotation, drift, OKLab toggle
uniform vec4 u_space;      // offset.xy, pointer.xy
uniform vec4 u_cursor;

#define u_resolution u_scene.xy
#define u_time u_scene.z
#define u_colorCount u_scene.w
#define u_scale u_shape.x
#define u_intensity u_shape.y
#define u_paramA u_shape.z
#define u_warp u_shape.w
#define u_detail u_surface.x
#define u_contrast u_surface.y
#define u_brightness u_surface.z
#define u_saturation u_surface.w
#define u_hue u_finish.x
#define u_vignette u_finish.y
#define u_blur u_finish.z
#define u_grain u_finish.w
#ifdef GL_FRAGMENT_PRECISION_HIGH
#define u_seed u_transform.x
#else
#define u_seed mod(u_transform.x, 31.0)
#endif
#define u_rotate u_transform.y
#define u_drift u_transform.z
#define u_oklab u_transform.w
#define u_offset u_space.xy
#define u_mouse u_space.zw
#define u_cursorPresence u_cursor.x
#define u_cursorEffect u_cursor.y
#define u_cursorStrength u_cursor.z
#define u_cursorRadius u_cursor.w

float hash21(vec2 p) {
#ifndef GL_FRAGMENT_PRECISION_HIGH
  p = mod(p, 31.0);
#endif
  p = fract(p * vec2(234.34, 435.345));
  p += dot(p, p + 34.23);
  return fract(p.x * p.y);
}

float grainHash(vec2 p) {
  vec3 p3 = fract(vec3(p.xyx) * 0.1031);
  p3 += dot(p3, p3.yzx + 33.33);
  return fract((p3.x + p3.y) * p3.z);
}

vec2 hash22(vec2 p) {
#ifndef GL_FRAGMENT_PRECISION_HIGH
  p = mod(p, 31.0);
#endif
  float n = sin(dot(p, vec2(41.0, 289.0)));
  return fract(vec2(15731.743, 7892.321) * n);
}

float noise(vec2 p) {
  vec2 i = floor(p);
  vec2 f = fract(p);
  vec2 u = f * f * (3.0 - 2.0 * f);
  return mix(
    mix(hash21(i), hash21(i + vec2(1.0, 0.0)), u.x),
    mix(hash21(i + vec2(0.0, 1.0)), hash21(i + vec2(1.0, 1.0)), u.x),
    u.y);
}

float fbm(vec2 p) {
  float v = 0.0;
  float a = 0.5;
  for (int i = 0; i < 5; i++) {
    v += a * noise(p);
    p = p * 2.03 + vec2(17.0, 9.2);
    a *= 0.5;
  }
  return v;
}

vec3 srgbToLinear(vec3 c) {
  return mix(c / 12.92, pow((c + 0.055) / 1.055, vec3(2.4)),
    step(0.04045, c));
}
vec3 linearToSrgb(vec3 c) {
  return mix(c * 12.92, 1.055 * pow(max(c, vec3(0.0)), vec3(1.0 / 2.4)) - 0.055,
    step(0.0031308, c));
}
vec3 linToOklab(vec3 c) {
  float l = 0.4122214708 * c.r + 0.5363325363 * c.g + 0.0514459929 * c.b;
  float m = 0.2119034982 * c.r + 0.6806995451 * c.g + 0.1073969566 * c.b;
  float s = 0.0883024619 * c.r + 0.2817188376 * c.g + 0.6299787005 * c.b;
  l = pow(max(l, 0.0), 1.0 / 3.0);
  m = pow(max(m, 0.0), 1.0 / 3.0);
  s = pow(max(s, 0.0), 1.0 / 3.0);
  return vec3(
    0.2104542553 * l + 0.7936177850 * m - 0.0040720468 * s,
    1.9779984951 * l - 2.4285922050 * m + 0.4505937099 * s,
    0.0259040371 * l + 0.7827717662 * m - 0.8086757660 * s);
}
vec3 oklabToLin(vec3 c) {
  float l = c.x + 0.3963377774 * c.y + 0.2158037573 * c.z;
  float m = c.x - 0.1055613458 * c.y - 0.0638541728 * c.z;
  float s = c.x - 0.0894841775 * c.y - 1.2914855480 * c.z;
  l = l * l * l; m = m * m * m; s = s * s * s;
  return vec3(
    4.0767416621 * l - 3.3077115913 * m + 0.2309699292 * s,
    -1.2684380046 * l + 2.6097574011 * m - 0.3413193965 * s,
    -0.0041960863 * l - 0.7034186147 * m + 1.7076147010 * s);
}
vec3 mixColour(vec3 a, vec3 b, float t) {
  if (u_oklab > 0.5) {
    vec3 la = linToOklab(srgbToLinear(a));
    vec3 lb = linToOklab(srgbToLinear(b));
    return clamp(linearToSrgb(oklabToLin(mix(la, lb, t))), 0.0, 1.0);
  }
  return mix(a, b, t);
}

vec3 palette(float x) {
  float n = max(u_colorCount - 1.0, 1.0);
  float f = clamp(x, 0.0, 1.0) * n;
  vec3 col = u_colors[0];
  for (int i = 0; i < 7; i++) {
    if (float(i) < n)
      col = mixColour(col, u_colors[i + 1],
        smoothstep(0.0, 1.0, clamp(f - float(i), 0.0, 1.0)));
  }
  return col;
}

vec3 hueRotate(vec3 col, float a) {
  const mat3 toYIQ = mat3(0.299, 0.596, 0.211,
                          0.587, -0.274, -0.523,
                          0.114, -0.322, 0.312);
  const mat3 toRGB = mat3(1.0, 1.0, 1.0,
                          0.956, -0.272, -1.106,
                          0.621, -0.647, 1.703);
  vec3 yiq = toYIQ * col;
  float ca = cos(a), sa = sin(a);
  yiq = vec3(yiq.x, yiq.y * ca - yiq.z * sa, yiq.y * sa + yiq.z * ca);
  return toRGB * yiq;
}

vec3 shade(vec2 uv, vec2 p, float t) {
  vec3 acc = u_colors[0] * 0.15;
  float total = 0.15;
  for (int i = 0; i < 8; i++) {
    if (float(i) >= u_colorCount) break;
    float fi = float(i);
    vec2 c = vec2(
      sin(t * (0.21 + fi * 0.071) + fi * 2.4 + u_seed),
      cos(t * (0.17 + fi * 0.093) + fi * 1.7)) * (0.45 + u_intensity * 0.35);
    float w = exp(-dot(p - c, p - c) * 6.0);
    acc += u_colors[i] * w;
    total += w;
  }
  return acc / total;
}

void main() {
  vec2 uv = gl_FragCoord.xy / u_resolution.xy;
  vec2 screenUv = uv;
  vec2 p = (gl_FragCoord.xy - 0.5 * u_resolution.xy)
    / min(u_resolution.x, u_resolution.y);
  float cursorMask = 0.0;

  if (u_cursorPresence > 0.001) {
    vec2 cursor = (0.5 * u_mouse * u_resolution.xy)
      / min(u_resolution.x, u_resolution.y);
    vec2 cursorDelta = p - cursor;
    if (u_cursorEffect < 0.5) {
      p += cursor * u_cursorPresence * u_cursorStrength * 0.55;
    } else {
      float cursorDistance = length(cursorDelta);
      vec2 cursorDirection = cursorDelta / max(cursorDistance, 0.0001);
      cursorMask = u_cursorPresence
        * (1.0 - smoothstep(0.0, u_cursorRadius, cursorDistance));
      if (u_cursorEffect < 1.5) {
        p -= cursorDirection * cursorMask * u_cursorStrength * 0.24;
      } else if (u_cursorEffect < 2.5) {
        float cursorAngle = cursorMask * u_cursorStrength * 2.2;
        float cc = cos(cursorAngle), cs = sin(cursorAngle);
        p = cursor + mat2(cc, -cs, cs, cc) * cursorDelta;
      } else if (u_cursorEffect < 3.5) {
        float ripple = sin(
          cursorDistance / max(u_cursorRadius, 0.001) * 18.0 - u_time * 5.0);
        p -= cursorDirection * ripple * cursorMask * u_cursorStrength * 0.07;
      }
    }
  }

  uv = p * min(u_resolution.x, u_resolution.y) / u_resolution.xy + 0.5;
  p *= u_scale;
  if (abs(u_rotate) > 0.0001) {
    float cr = cos(u_rotate), sr = sin(u_rotate);
    p = mat2(cr, -sr, sr, cr) * p;
  }
  p += u_offset;
  if (u_drift > 0.0001)
    p += u_drift * vec2(sin(u_time * 0.31), cos(u_time * 0.23));
  if (u_warp > 0.0) {
    p += u_warp * (vec2(
      fbm(p * u_detail + u_seed),
      fbm(p * u_detail + vec2(5.2, 1.3))) - 0.5);
  }
  vec3 col;
  if (u_blur > 0.0) {
    float e = u_blur;
    float pe = e * u_scale;
    vec2 uvE = vec2(e) * min(u_resolution.x, u_resolution.y) / u_resolution.xy;
    col  = shade(uv, p, u_time) * 0.36;
    col += shade(uv + vec2(uvE.x, 0.0), p + vec2(pe, 0.0), u_time) * 0.16;
    col += shade(uv - vec2(uvE.x, 0.0), p - vec2(pe, 0.0), u_time) * 0.16;
    col += shade(uv + vec2(0.0, uvE.y), p + vec2(0.0, pe), u_time) * 0.16;
    col += shade(uv - vec2(0.0, uvE.y), p - vec2(0.0, pe), u_time) * 0.16;
  } else {
    col = shade(uv, p, u_time);
  }
  if (abs(u_contrast - 1.0) > 0.0001)
    col = (col - 0.5) * u_contrast + 0.5;
  if (abs(u_saturation - 1.0) > 0.0001) {
    float luma = dot(col, vec3(0.299, 0.587, 0.114));
    col = mix(vec3(luma), col, u_saturation);
  }
  if (abs(u_hue) > 0.0001)
    col = hueRotate(col, u_hue);
  if (abs(u_brightness) > 0.0001)
    col += u_brightness;
  if (u_vignette > 0.0001) {
    float vd = length(screenUv - 0.5) * 1.41421356;
    col *= 1.0 - u_vignette * smoothstep(0.35, 1.0, vd);
  }
  if (u_cursorPresence > 0.001 && u_cursorEffect > 3.5)
    col += (vec3(0.18) + col * 0.12) * cursorMask * u_cursorStrength;
  if (u_grain > 0.0001)
    col += (grainHash(
      gl_FragCoord.xy + vec2(u_seed * 17.0, u_seed * 31.0)) - 0.5) * u_grain;
  gl_FragColor = vec4(clamp(col, 0.0, 1.0), 1.0);
}`;

      const UNIFORMS = {
        colors: [
          [0.09019607843137255, 0.09019607843137255, 0.09019607843137255],
          [0.5686274509803921, 0.7725490196078432, 1],
          [0.22745098039215686, 0.5058823529411764, 0.9647058823529412],
          [0.1450980392156863, 0.38823529411764707, 0.9372549019607843],
          [0.10196078431372549, 0.3058823529411765, 0.8549019607843137],
          [0.10196078431372549, 0.3058823529411765, 0.8549019607843137],
          [0.10196078431372549, 0.3058823529411765, 0.8549019607843137],
          [0.10196078431372549, 0.3058823529411765, 0.8549019607843137]
        ],
        colorCount: 5,
        scale: 1.260,
        intensity: 0.350,
        paramA: 0.280,
        warp: 0.000,
        detail: 1.824,
        contrast: 1.374,
        brightness: -0.020,
        saturation: 0.680,
        hue: 0.0000,
        vignette: 0.540,
        blur: 0.0000,
        grain: 0.220,
        seed: 1.0,
        rotate: 0.0000,
        offsetX: -0.050,
        offsetY: 0.000,
        drift: 0.060,
        cursorEnabled: true,
        cursorEffect: 4.0,
        cursorStrength: 0.500,
        cursorRadius: 0.800,
        oklab: 1.0,
        timeScale: 1.088,

      const canvas = document.getElementById('shader-canvas');
      if (!canvas) return;
      const gl = canvas.getContext('webgl', { antialias: false, powerPreference: 'low-power' });
      if (!gl) return;

      const compile = (type, src) => {
        const s = gl.createShader(type);
        gl.shaderSource(s, src);
        gl.compileShader(s);
        return s;
      };

      const program = gl.createProgram();
      const vertexShader = compile(gl.VERTEX_SHADER, VERT);
      const fragmentShader = compile(gl.FRAGMENT_SHADER, FRAG);
      gl.attachShader(program, vertexShader);
      gl.attachShader(program, fragmentShader);
      gl.linkProgram(program);
      gl.deleteShader(vertexShader);
      gl.deleteShader(fragmentShader);
      gl.useProgram(program);

      const buf = gl.createBuffer();
      gl.bindBuffer(gl.ARRAY_BUFFER, buf);
      gl.bufferData(
        gl.ARRAY_BUFFER,
        new Float32Array([-1, -1, 3, -1, -1, 3]),
        gl.STATIC_DRAW
      );
      const loc = gl.getAttribLocation(program, 'a_position');
      gl.enableVertexAttribArray(loc);
      gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);

      const uni = {
        colors: gl.getUniformLocation(program, 'u_colors'),
        scene: gl.getUniformLocation(program, 'u_scene'),
        shape: gl.getUniformLocation(program, 'u_shape'),
        surface: gl.getUniformLocation(program, 'u_surface'),
        finish: gl.getUniformLocation(program, 'u_finish'),
        transform: gl.getUniformLocation(program, 'u_transform'),
        space: gl.getUniformLocation(program, 'u_space'),
        cursor: gl.getUniformLocation(program, 'u_cursor'),
      };

      gl.uniform3fv(uni.colors, new Float32Array(UNIFORMS.colors.flat()));
      gl.uniform4f(uni.shape, UNIFORMS.scale, UNIFORMS.intensity, UNIFORMS.paramA, UNIFORMS.warp);
      gl.uniform4f(uni.surface, UNIFORMS.detail, UNIFORMS.contrast, UNIFORMS.brightness, UNIFORMS.saturation);
      gl.uniform4f(uni.finish, UNIFORMS.hue, UNIFORMS.vignette, UNIFORMS.blur, UNIFORMS.grain);
      gl.uniform4f(uni.transform, UNIFORMS.seed, UNIFORMS.rotate, UNIFORMS.drift, UNIFORMS.oklab);
      gl.uniform4f(uni.cursor, 0, UNIFORMS.cursorEffect, UNIFORMS.cursorStrength, UNIFORMS.cursorRadius);

      let targetX = 0;
      let targetY = 0;
      let targetPresence = 0;
      let mouseX = 0;
      let mouseY = 0;
      let cursorPresence = 0;
      let pointerKnown = false;
      let pointerClientX = 0;
      let pointerClientY = 0;
      let bounds = canvas.getBoundingClientRect();
      let raf = 0;
      let lastNow = null;
      let visible = document.visibilityState === 'visible';
      let inView = true;
      const start = performance.now();
      const timeAnimated = Math.abs(UNIFORMS.timeScale) > 0.0001;

      const resizeCanvas = () => {
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        const rawWidth = Math.max(1, Math.round(window.innerWidth * dpr));
        const rawHeight = Math.max(1, Math.round(window.innerHeight * dpr));
        const pixelScale = Math.min(
          1,
          Math.sqrt(2_000_000 / Math.max(1, rawWidth * rawHeight))
        );
        const width = Math.max(1, Math.round(rawWidth * pixelScale));
        const height = Math.max(1, Math.round(rawHeight * pixelScale));
        if (canvas.width !== width || canvas.height !== height) {
          canvas.width = width;
          canvas.height = height;
          gl.viewport(0, 0, width, height);
        }
      };

      function requestRender() {
        if (visible && inView && raf === 0) {
          raf = requestAnimationFrame(render);
        }
      }

      const updatePointerTarget = () => {
        if (!pointerKnown || bounds.width === 0 || bounds.height === 0) return;
        const inside =
          pointerClientX >= bounds.left &&
          pointerClientX <= bounds.right &&
          pointerClientY >= bounds.top &&
          pointerClientY <= bounds.bottom;
        if (!inside) {
          targetPresence = 0;
          requestRender();
          return;
        }
        const nextX = ((pointerClientX - bounds.left) / bounds.width) * 2 - 1;
        const nextY = -(((pointerClientY - bounds.top) / bounds.height) * 2 - 1);
        if (targetPresence === 0 && cursorPresence < 0.01) {
          mouseX = nextX;
          mouseY = nextY;
        }
        targetX = nextX;
        targetY = nextY;
        targetPresence = 1;
        requestRender();
      };

      const onPointerMove = (event) => {
        pointerKnown = true;
        pointerClientX = event.clientX;
        pointerClientY = event.clientY;
        bounds = canvas.getBoundingClientRect();
        updatePointerTarget();
      };

      const onPointerLeave = () => {
        pointerKnown = false;
        targetPresence = 0;
        requestRender();
      };

      const updateLayout = () => {
        bounds = canvas.getBoundingClientRect();
        resizeCanvas();
        updatePointerTarget();
        requestRender();
      };

      window.addEventListener('resize', updateLayout);
      if (UNIFORMS.cursorEnabled) {
        window.addEventListener('pointermove', onPointerMove, { passive: true });
        window.addEventListener('pointercancel', onPointerLeave);
        window.addEventListener('scroll', updateLayout, true);
        window.addEventListener('blur', onPointerLeave);
        document.documentElement.addEventListener('pointerleave', onPointerLeave);
      }

      document.addEventListener('visibilitychange', () => {
        visible = document.visibilityState === 'visible';
        if (visible) requestRender();
        else if (raf !== 0) {
          cancelAnimationFrame(raf);
          raf = 0;
          lastNow = null;
        }
      });

      function render(now) {
        raf = 0;
        if (!visible || !inView) return;
        const dt = lastNow === null ? 0 : Math.min((now - lastNow) / 1000, 0.1);
        lastNow = now;
        const follow = 1 - Math.exp(-12 * dt);
        mouseX += (targetX - mouseX) * follow;
        mouseY += (targetY - mouseY) * follow;
        cursorPresence += (targetPresence - cursorPresence) * follow;
        resizeCanvas();
        const width = canvas.width;
        const height = canvas.height;
        gl.uniform4f(
          uni.scene,
          width,
          height,
          ((now - start) / 1000) * UNIFORMS.timeScale,
          UNIFORMS.colorCount
        );
        gl.uniform4f(
          uni.space,
          UNIFORMS.offsetX,
          UNIFORMS.offsetY,
          mouseX,
          mouseY
        );
        gl.uniform4f(
          uni.cursor,
          UNIFORMS.cursorEnabled ? cursorPresence : 0,
          UNIFORMS.cursorEffect,
          UNIFORMS.cursorStrength,
          UNIFORMS.cursorRadius
        );
        gl.drawArrays(gl.TRIANGLES, 0, 3);
        const pointerSettling =
          Math.abs(targetX - mouseX) > 0.001 ||
          Math.abs(targetY - mouseY) > 0.001 ||
          Math.abs(targetPresence - cursorPresence) > 0.001;
        if (timeAnimated || pointerSettling) requestRender();
        else lastNow = null;
      }

      updateLayout();
    })();

    // --- Liquid Metal Button WebGL Shader Engine ---
    let setLmSpeed = null;

    (function initLiquidMetalShader() {
      const canvas = document.getElementById('lm-shader-canvas');
      if (!canvas) return;
      const gl = canvas.getContext('webgl', { antialias: false, powerPreference: 'low-power' });
      if (!gl) return;

      const VERT = `attribute vec2 a_pos;
void main() {
  gl_Position = vec4(a_pos, 0.0, 1.0);
}`;

      const FRAG = `precision mediump float;
uniform vec2 u_resolution;
uniform float u_time;
uniform float u_speed;
uniform float u_repetition;
uniform float u_softness;
uniform float u_shiftRed;
uniform float u_shiftBlue;
uniform float u_angle;
uniform float u_scale;
uniform float u_offsetX;
uniform float u_offsetY;

void main() {
    vec2 st = (gl_FragCoord.xy - 0.5 * u_resolution.xy) / min(u_resolution.x, u_resolution.y);
    float t = u_time * u_speed * 0.5;
    
    float rad = radians(u_angle);
    mat2 rot = mat2(cos(rad), -sin(rad), sin(rad), cos(rad));
    st = rot * st;
    st *= u_scale;
    st += vec2(u_offsetX, u_offsetY);
    
    vec2 p = st;
    for(int i = 1; i <= 4; i++) {
        float fi = float(i);
        p.x += (0.35 / fi) * sin(fi * u_repetition * p.y + t * 0.9 + fi * 0.8);
        p.y += (0.35 / fi) * cos(fi * u_repetition * p.x + t * 0.9 + fi * 0.8);
    }
    
    vec3 norm = normalize(vec3(cos(p.x * 2.2), sin(p.y * 2.2), u_softness + 0.25));
    vec3 light = normalize(vec3(0.6, 0.8, 0.9));
    
    float diff = max(dot(norm, light), 0.0);
    float spec = pow(max(dot(reflect(-light, norm), vec3(0.0, 0.0, 1.0)), 0.0), 20.0);
    
    float r = sin(p.x * 2.0 + t + u_shiftRed) * 0.5 + 0.5;
    float g = sin(p.x * 2.0 + t) * 0.5 + 0.5;
    float b = sin(p.x * 2.0 + t - u_shiftBlue) * 0.5 + 0.5;
    
    // Liquid chrome with metallic emerald / cyan sheen
    vec3 metal = mix(vec3(0.12, 0.16, 0.20), vec3(0.85, 0.92, 0.98), diff);
    metal += vec3(spec * 0.95);
    metal += vec3(r * 0.1, g * 0.35, b * 0.2); // Emerald chrome iridescence
    
    gl_FragColor = vec4(clamp(metal, 0.0, 1.0), 1.0);
}`;

      const compile = (type, src) => {
        const s = gl.createShader(type);
        gl.shaderSource(s, src);
        gl.compileShader(s);
        return s;
      };

      const prog = gl.createProgram();
      const vs = compile(gl.VERTEX_SHADER, VERT);
      const fs = compile(gl.FRAGMENT_SHADER, FRAG);
      gl.attachShader(prog, vs);
      gl.attachShader(prog, fs);
      gl.linkProgram(prog);
      gl.deleteShader(vs);
      gl.deleteShader(fs);
      gl.useProgram(prog);

      const buf = gl.createBuffer();
      gl.bindBuffer(gl.ARRAY_BUFFER, buf);
      gl.bufferData(
        gl.ARRAY_BUFFER,
        new Float32Array([-1, -1, 3, -1, -1, 3]),
        gl.STATIC_DRAW
      );
      const loc = gl.getAttribLocation(prog, 'a_pos');
      gl.enableVertexAttribArray(loc);
      gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);

      const uRes = gl.getUniformLocation(prog, 'u_resolution');
      const uTime = gl.getUniformLocation(prog, 'u_time');
      const uSpeed = gl.getUniformLocation(prog, 'u_speed');
      const uRep = gl.getUniformLocation(prog, 'u_repetition');
      const uSoft = gl.getUniformLocation(prog, 'u_softness');
      const uSR = gl.getUniformLocation(prog, 'u_shiftRed');
      const uSB = gl.getUniformLocation(prog, 'u_shiftBlue');
      const uAngle = gl.getUniformLocation(prog, 'u_angle');
      const uScale = gl.getUniformLocation(prog, 'u_scale');
      const uOffX = gl.getUniformLocation(prog, 'u_offsetX');
      const uOffY = gl.getUniformLocation(prog, 'u_offsetY');

      gl.uniform1f(uRep, 4.0);
      gl.uniform1f(uSoft, 0.5);
      gl.uniform1f(uSR, 0.3);
      gl.uniform1f(uSB, 0.3);
      gl.uniform1f(uAngle, 45.0);
      gl.uniform1f(uScale, 8.0);
      gl.uniform1f(uOffX, 0.1);
      gl.uniform1f(uOffY, -0.1);

      let currentSpeed = 0.6;
      setLmSpeed = (s) => { currentSpeed = s; };

      const resize = () => {
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        const rect = canvas.getBoundingClientRect();
        const w = Math.round(rect.width * dpr) || 480;
        const h = Math.round(rect.height * dpr) || 104;
        if (canvas.width !== w || canvas.height !== h) {
          canvas.width = w;
          canvas.height = h;
          gl.viewport(0, 0, w, h);
        }
      };

      resize();
      window.addEventListener('resize', resize);

      const startTime = performance.now();
      let rafId = 0;

      function loop(now) {
        if (document.visibilityState === 'visible') {
          const elapsed = (now - startTime) / 1000;
          gl.uniform2f(uRes, canvas.width, canvas.height);
          gl.uniform1f(uTime, elapsed);
          gl.uniform1f(uSpeed, currentSpeed);
          gl.drawArrays(gl.TRIANGLES, 0, 3);
        }
        rafId = requestAnimationFrame(loop);
      }
      rafId = requestAnimationFrame(loop);
    })();
  </script>

  <!-- Application Dashboard State & Communication -->
  <script>
    let isBusy = false;

    async function fetchStatus() {
      try {
        const res = await fetch('/api/status');
        if (!res.ok) throw new Error('Network error');
        const data = await res.json();
        updateUI(data);
      } catch (err) {
        const statusText = document.getElementById('status-text');
        const statusDot = document.getElementById('status-dot');
        if (statusText) statusText.innerText = 'OFFLINE';
        if (statusDot) {
          statusDot.style.background = 'var(--danger)';
          statusDot.className = 'status-dot';
        }
      }
    }

    function updateUI(data) {
      const statusText = document.getElementById('status-text');
      const statusDot = document.getElementById('status-dot');
      const btnStart = document.getElementById('btn-start');
      const btnText = document.getElementById('btn-text');
      const btnStop = document.getElementById('btn-stop');
      const progressBox = document.getElementById('progress-box');
      const progressFill = document.getElementById('progress-fill');
      const progressText = document.getElementById('progress-text');

      // Status & Action Buttons
      const status = data.status || 'IDLE';
      isBusy = (status === 'SCANNING_INBOX' || status === 'PROCESSING');

      if (status === 'SCANNING_INBOX') {
        if (statusText) statusText.innerText = 'Scanning...';
        if (statusDot) {
          statusDot.style.background = 'var(--warning)';
          statusDot.className = 'status-dot pulse';
        }
        if (btnStart) btnStart.disabled = true;
        if (btnText) btnText.innerText = 'Scanning...';
        if (btnStop) btnStop.style.display = 'inline-flex';
        if (progressBox) progressBox.style.display = 'block';
        if (progressFill) progressFill.style.width = '20%';
        if (progressText) progressText.innerText = 'Scanning inbox...';
      } else if (status === 'PROCESSING') {
        const current = data.batchProgress?.current || 0;
        const total = data.batchProgress?.total || 1;
        const pct = Math.min(100, Math.round((current / total) * 100));
        if (statusText) statusText.innerText = `Processing (${current}/${total})`;
        if (statusDot) {
          statusDot.style.background = 'var(--accent)';
          statusDot.className = 'status-dot pulse';
        }
        if (btnStart) btnStart.disabled = true;
        if (btnText) btnText.innerText = `Processing (${current}/${total})`;
        if (btnStop) btnStop.style.display = 'inline-flex';
        if (progressBox) progressBox.style.display = 'block';
        if (progressFill) progressFill.style.width = `${pct}%`;
        if (progressText) progressText.innerText = data.batchProgress?.summary || 'Processing...';
      } else if (status === 'COMPLETED') {
        if (statusText) statusText.innerText = 'Completed';
        if (statusDot) {
          statusDot.style.background = 'var(--success)';
          statusDot.className = 'status-dot';
        }
        if (btnStart) btnStart.disabled = false;
        if (btnText) btnText.innerText = 'START BATCH';
        if (btnStop) btnStop.style.display = 'none';
        if (progressBox) progressBox.style.display = 'block';
        if (progressFill) progressFill.style.width = '100%';
        if (progressText) progressText.innerText = 'Batch completed';
      } else {
        if (statusText) statusText.innerText = 'Ready';
        if (statusDot) {
          statusDot.style.background = 'var(--success)';
          statusDot.className = 'status-dot';
        }
        if (btnStart) btnStart.disabled = false;
        if (btnText) btnText.innerText = 'START BATCH';
        if (btnStop) btnStop.style.display = 'none';
        if (progressBox) progressBox.style.display = 'none';
      }

      const lmRoot = document.getElementById('liquid-metal-root');
      if (lmRoot) {
        if (isBusy || (btnStart && btnStart.disabled)) {
          lmRoot.classList.add('is-disabled');
        } else {
          lmRoot.classList.remove('is-disabled');
        }
      }

      // Metrics
      const mPending = document.getElementById('metric-pending');
      const mCompleted = document.getElementById('metric-completed');
      if (mPending) mPending.innerText = data.queue?.pending || 0;
      if (mCompleted) mCompleted.innerText = data.queue?.completed || 0;

      // Recent Reels Table (Creator, Keyword, Status)
      const tbody = document.getElementById('reels-tbody');
      const recent = data.recentJobs || [];

      if (tbody) {
        if (recent.length === 0) {
          tbody.innerHTML = '<tr><td colspan="3" style="text-align: center; color: var(--text-muted); padding: 20px 14px;">No recent reels.</td></tr>';
        } else {
          tbody.innerHTML = recent.map(j => {
            let statusTag = `<span class="tag tag-muted">${j.status}</span>`;
            if (j.status === 'COMPLETED') statusTag = `<span class="tag tag-success">COMPLETED</span>`;
            else if (j.status === 'FAILED') statusTag = `<span class="tag tag-fail">FAILED</span>`;
            else if (j.status === 'PENDING') statusTag = `<span class="tag tag-blue">PENDING</span>`;

            return `
              <tr>
                <td><span style="font-weight: 600;">@${j.creator_username || 'unknown'}</span></td>
                <td><strong style="color: var(--accent);">${j.keyword || '🙌'}</strong></td>
                <td>${statusTag}</td>
              </tr>
            `;
          }).join('');
        }
      }

      // Activity Log
      const consoleBox = document.getElementById('console-box');
      const logs = data.recentLogs || [];
      if (consoleBox && logs.length > 0) {
        consoleBox.innerHTML = logs.map(l => `
          <div class="log-entry">
            <span class="log-time">[${l.time}]</span>
            <span class="log-msg">${l.message}</span>
          </div>
        `).join('');
        consoleBox.scrollTop = consoleBox.scrollHeight;
      }
    }

    function handleStartBatchClick(e) {
      if (isBusy) return;

      // Accelerated fluid ripple speed on activation
      if (typeof setLmSpeed === 'function') {
        setLmSpeed(2.4);
        setTimeout(() => {
          if (!isBusy && typeof setLmSpeed === 'function') {
            setLmSpeed(1.0);
          }
        }, 380);
      }

      // Spawn interactive fluid ripple
      const btn = document.getElementById('btn-start');
      if (btn && e && typeof e.clientX === 'number' && e.clientX > 0) {
        const rect = btn.getBoundingClientRect();
        const ripple = document.createElement('div');
        ripple.className = 'lm-ripple';
        ripple.style.left = `${e.clientX - rect.left}px`;
        ripple.style.top = `${e.clientY - rect.top}px`;
        btn.appendChild(ripple);
        setTimeout(() => ripple.remove(), 650);
      }

      triggerBatch();
    }

    // Bind hover and press interactions to Liquid Metal root
    (function setupLiquidMetalEvents() {
      const btn = document.getElementById('btn-start');
      const lmRoot = document.getElementById('liquid-metal-root');
      if (!btn || !lmRoot) return;

      btn.addEventListener('mouseenter', () => {
        if (!isBusy && typeof setLmSpeed === 'function') {
          setLmSpeed(1.2);
        }
      });

      btn.addEventListener('mouseleave', () => {
        lmRoot.classList.remove('is-pressed');
        if (!isBusy && typeof setLmSpeed === 'function') {
          setLmSpeed(0.6);
        }
      });

      btn.addEventListener('mousedown', () => {
        if (!isBusy) {
          lmRoot.classList.add('is-pressed');
        }
      });

      window.addEventListener('mouseup', () => {
        lmRoot.classList.remove('is-pressed');
      });
    })();

    async function triggerBatch() {
      if (isBusy) return;
      const btnStart = document.getElementById('btn-start');
      const btnText = document.getElementById('btn-text');
      if (btnStart) btnStart.disabled = true;
      if (btnText) btnText.innerText = 'Starting...';

      try {
        const res = await fetch('/api/start', { method: 'POST' });
        const resData = await res.json();
        if (!res.ok) alert(resData.error || 'Failed to start batch');
      } catch (err) {
        alert('Error triggering batch: ' + err.message);
      } finally {
        fetchStatus();
      }
    }

    async function stopBatch() {
      if (!confirm('Are you sure you want to stop the current batch run?')) return;
      try {
        await fetch('/api/stop', { method: 'POST' });
      } catch (err) {
        alert('Error stopping batch: ' + err.message);
      } finally {
        fetchStatus();
      }
    }

    async function unfollowEligible() {
      if (isBusy) return;
      if (!confirm('Unfollow creators who have been followed for at least 2 days?')) return;
      const btn = document.getElementById('btn-unfollow-eligible');
      if (btn) {
        btn.disabled = true;
        btn.innerText = 'Unfollowing...';
      }
      try {
        const res = await fetch('/api/unfollow', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ forceAll: false, minAgeHours: 48 })
        });
        const json = await res.json();
        alert(json.message || `Unfollowed ${json.count} creator(s)`);
      } catch (err) {
        alert('Error unfollowing creators: ' + err.message);
      } finally {
        fetchStatus();
      }
    }

    async function unfollowAll() {
      if (isBusy) return;
      if (!confirm('⚠️ WARNING: This will unfollow ALL followed accounts including recently followed creators within the 2-day protection window. Are you sure?')) return;
      const btn = document.getElementById('btn-unfollow-all');
      if (btn) {
        btn.disabled = true;
        btn.innerText = 'Unfollowing all...';
      }
      try {
        const res = await fetch('/api/unfollow', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ forceAll: true })
        });
        const json = await res.json();
        alert(json.message || `Unfollowed ${json.count} creator(s)`);
      } catch (err) {
        alert('Error unfollowing all: ' + err.message);
      } finally {
        fetchStatus();
      }
    }

    // Poll status every 1500ms
    fetchStatus();
    setInterval(fetchStatus, 1500);
  </script>
</body>
